name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: changes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          TAG_COUNT=$(git tag --sort=-creatordate | wc -l)
          if [ "$TAG_COUNT" -le 1 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "First release — no previous tag to compare"
          else
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
            if [ -z "$PREV_TAG" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "No valid previous tag found — treating as first release"
            else
              CODE_CHANGES=$(git diff --name-only "$PREV_TAG"..HEAD -- . ':!*.md' ':!.github/ISSUE_TEMPLATE/*' ':!.github/pull_request_template.md' ':!CODE_OF_CONDUCT.md' ':!CONTRIBUTING.md' ':!SECURITY.md' ':!LICENSE' | wc -l)
              if [ "$CODE_CHANGES" -eq 0 ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "Only documentation changes since $PREV_TAG — skipping release"
              else
                echo "skip=false" >> $GITHUB_OUTPUT
                echo "$CODE_CHANGES code file(s) changed since $PREV_TAG"
              fi
            fi
          fi

      - name: Delete docs-only tag
        if: steps.changes.outputs.skip == 'true'
        run: |
          echo "::warning::Skipping release — only documentation files changed. Deleting tag."
          git push --delete origin ${GITHUB_REF#refs/tags/} || true

      - name: Extract mod info
        if: steps.changes.outputs.skip != 'true'
        id: mod
        run: |
          MOD_NAME=$(python3 -c "import json; print(json.load(open('mod_info.json'))['name'])")
          VERSION=${GITHUB_REF#refs/tags/}
          echo "name=${MOD_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building ${MOD_NAME} ${VERSION}"

      - name: Build release zip
        if: steps.changes.outputs.skip != 'true'
        run: |
          MOD_NAME="${{ steps.mod.outputs.name }}"
          VERSION="${{ steps.mod.outputs.version }}"

          # Folder name inside the zip matches the installed folder name.
          PKG="BankOfStarsector"
          mkdir -p "${PKG}"
          cp mod_info.json "${PKG}/"
          cp -r jars/ "${PKG}/"
          [ -d data ] && cp -r data/ "${PKG}/" || true
          [ -d graphics ] && cp -r graphics/ "${PKG}/" || true
          cp *.version "${PKG}/" 2>/dev/null || true
          [ -f changelog.txt ] && cp changelog.txt "${PKG}/" || true
          [ -f LICENSE ] && cp LICENSE "${PKG}/" || true
          [ -f README.md ] && cp README.md "${PKG}/" || true

          zip -r "${PKG}-${VERSION}.zip" "${PKG}/"
          # Stable name for the version checker's directDownloadURL (releases/latest/download/BankOfStarsector.zip)
          cp "${PKG}-${VERSION}.zip" "${PKG}.zip"
          ls -la *.zip
      - name: Release notes
        if: steps.changes.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.mod.outputs.version }}"
          # This version's section of changelog.txt (header "0.3.1-beta" for tag "v0.3.1-beta").
          CHANGES=$(awk -v ver="${VERSION#v}" '$0==ver{f=1;next} f&&/^[0-9]/{exit} f{print}' changelog.txt)
          {
            echo "## ${{ steps.mod.outputs.name }} ${VERSION}"
            echo
            echo "A banking and economy mod for Starsector: loans, a real credit score, credit lines, colony mortgages with foreclosure auctions, fleet insurance, investments and debt collection fleets."
            echo
            if [ -n "$CHANGES" ]; then
              echo "### What's new"
              echo "$CHANGES"
              echo
            fi
            echo "### Installation"
            echo "1. Download \`BankOfStarsector.zip\` below"
            echo "2. Extract it to your \`Starsector/mods/\` folder"
            echo "3. Enable **Bank of Starsector** in the launcher"
            echo
            echo "Saves from earlier versions load fine. No required dependencies; **Nexerelin**, **NexusUI** and **LunaLib** are optional (LunaLib's version checker will tell you about the next release)."
            echo
            echo "[Features, FAQ and lore](https://github.com/${{ github.repository }}#readme)"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.changes.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.mod.outputs.name }} ${{ steps.mod.outputs.version }}"
          files: "*.zip"
          generate_release_notes: false
          body_path: release_notes.md
